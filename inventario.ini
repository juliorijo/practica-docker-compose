# Se usa 127.0.0.1 + puerto publicado: funciona desde WSL/Linux/Windows con Docker Desktop.
# La IP interna de cada contenedor (172.30.0.x) se indica en ip_interna (informativa).
[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2221 ip_interna=172.30.0.11
servidor2 ansible_host=127.0.0.1 ansible_port=2222 ip_interna=172.30.0.12
servidor3 ansible_host=127.0.0.1 ansible_port=2223 ip_interna=172.30.0.13
servidor4 ansible_host=127.0.0.1 ansible_port=2224 ip_interna=172.30.0.14
servidor5 ansible_host=127.0.0.1 ansible_port=2225 ip_interna=172.30.0.15

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
