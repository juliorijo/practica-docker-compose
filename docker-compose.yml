x-ubuntu: &ubuntu
  build: .
  image: ubuntu-ssh:latest

services:
  servidor1:
    <<: *ubuntu
    hostname: servidor1
    ports: ["2221:22"]
    networks:
      ansible_net:
        ipv4_address: 172.30.0.11
  servidor2:
    <<: *ubuntu
    hostname: servidor2
    ports: ["2222:22"]
    networks:
      ansible_net:
        ipv4_address: 172.30.0.12
  servidor3:
    <<: *ubuntu
    hostname: servidor3
    ports: ["2223:22"]
    networks:
      ansible_net:
        ipv4_address: 172.30.0.13
  servidor4:
    <<: *ubuntu
    hostname: servidor4
    ports: ["2224:22"]
    networks:
      ansible_net:
        ipv4_address: 172.30.0.14
  servidor5:
    <<: *ubuntu
    hostname: servidor5
    ports: ["2225:22"]
    networks:
      ansible_net:
        ipv4_address: 172.30.0.15

networks:
  ansible_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
